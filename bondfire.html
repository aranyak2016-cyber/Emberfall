[{1:'#0a1a3a',2:'#3a86ff',3:'#a0e0ff',4:'#fff'},{1:'#0b2e13',2:'#3fa34d',3:'#d9f99d',4:'#fff'},{1:'#3b0a0a',2:'#ff6b35',3:'#ffd23f',4:'#fff'}].forEach((p,i)=>def('boss'+i,BR,p,['.3.33.3.','.333333.','12222221','12432421','12222221','.122221.','.122221.','.11..11.']));

const sfx={sel:()=>tone(880,.05,'square',.07),ok:()=>{tone(523,.08);tone(784,.08,'square',.08,0,.07);tone(1046,.15,'square',.08,0,.14)},whoosh:()=>{noise(.7,.15);tone(900,.7,'sawtooth',.05,-800)},slash:()=>tone(320,.1,'sawtooth',.07,500),hit:()=>{tone(160,.12,'square',.1,-100);noise(.07,.1)},hurt:()=>{tone(220,.3,'sawtooth',.13,-170);noise(.15,.12)},pick:()=>{tone(660,.08);tone(990,.12,'square',.09,0,.08)},door:()=>{tone(140,.35,'triangle',.2,-70);tone(220,.2,'square',.05,0,.15)},kill:()=>{tone(400,.15,'square',.09,-300);noise(.12,.1)},dash:()=>tone(500,.12,'triangle',.1,-350),fire:()=>tone(240,.1,'square',.04,-120),boss:()=>{tone(90,.8,'sawtooth',.2,-40);tone(70,.9,'square',.1,0,.2)},stairs:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.15,'square',.09,0,i*.1))};
const N=s=>110*Math.pow(2,s/12),bass=[0,0,7,0,5,5,3,7],lead=[12,null,15,null,19,15,12,null,10,null,14,null,17,14,10,null];
const BR_=[0,-4,3,-2],ARP=[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]],LM=[[24,0,27,0,31,0,29,27,24,0,0,0,27,0,0,0],[20,0,24,0,32,0,27,24,20,0,0,0,24,0,27,0],[27,0,31,0,34,0,31,27,27,0,0,0,31,0,0,0],[26,0,29,0,34,0,31,29,26,0,0,29,0,26,0,0]];

 if(AC&&!mute&&!G.paused){
  if(m=='play'){const bo=G.room&&G.room.boss&&G.en.length>0;if(!(i&1))tone(N(bass[(i>>1)&7]),.28,'triangle',.17);const l=lead[i%16];if(l!=null)tone(N(l+(DP()>2?0:12)),.12,'square',.035);if(bo&&i&1)noise(.04,.05)}
  else if(m=='menu'){const b=(i>>4)&3,s=i&15;if(!(i&1))tone(N(BR_[b]+(((i>>1)&3)==3?12:0)),.13,'triangle',.22);tone(N(ARP[b][[0,1,2,1][i&3]]+24),.08,'square',.025);const l=LM[b][s];if(l)tone(N(l),s%8==0?.22:.11,'square',.04);if(!(i&3))tone(140,.1,'sine',.3,-110);if((i&7)==4||i%64>59)noise(.1,.13);if(i&1)noise(.03,.05)}
  else if(m=='intro'){const b=(i>>3)&3;if(!(i&7))tone(N(BR_[b]),1.4,'triangle',.2);tone(N(ARP[b][i%3]+12),.4,'triangle',.07)}}
 i++;setTimeout(tick,m=='menu'?118:m=='intro'?210:150)};tick()}
// ---------- input ----------
const keys={},press={};let tj={x:0,y:0,id:null,ox:0,oy:0};
function pressed(...c){let r=0;c.forEach(k=>{if(press[k]){r=1;press[k]=0}});return r}
addEventListener('keydown',e=>{keys[e.code]=1;if(!e.repeat)press[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();initAudio();
 if(e.code=='KeyM'&&G.mode!='code'&&G.mode!='menu')mute=!mute;if(e.code=='KeyT'&&G.mode!='code')toggleCtl();if(e.code=='KeyP'&&G.mode=='play')G.paused=!G.paused;
 menuKey(e.code)});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;if(G.mode=='play')G.paused=true});
C.addEventListener('pointerdown',e=>{initAudio();if(G.mode!='play'){tapMenu(e);return}if(G.paused){G.paused=false;return}if(TOUCH)return;const r=C.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*256,sy=(e.clientY-r.top)/r.height*208;if(EMB&&sy<18&&sx>=80&&sx<118){press.KeyF=1;return}if(sy<18&&sx>=118&&sx<162){press['Digit'+(1+Math.min(2,(sx-120)/14|0))]=1;return}if((e.clientX-r.left)/r.width<.5){tj.id=e.pointerId;tj.ox=e.clientX;tj.oy=e.clientY;tj.x=tj.y=0}else press[(e.clientY-r.top)/r.height<.35?'ShiftLeft':'Space']=1});
C.addEventListener('pointermove',e=>{if(e.pointerId!==tj.id)return;const dx=e.clientX-tj.ox,dy=e.clientY-tj.oy,m=hyp(dx,dy);if(m<8){tj.x=tj.y=0;return}const k=Math.min(1,m/30)/m;tj.x=dx*k;tj.y=dy*k});
const tup=e=>{if(e.pointerId===tj.id){tj.id=null;tj.x=tj.y=0}};C.addEventListener('pointerup',tup);C.addEventListener('pointercancel',tup);
// ---------- world ----------
let G={mode:'boot',t:0,floor:1,en:[],pt:[],room:null,paused:false},BEST=0;
try{BEST=+localStorage.emberfall_best||0}catch(e){}
function save(){try{if(G.score>BEST){BEST=G.score;localStorage.emberfall_best=BEST}if(G.endless&&G.wave>EBEST){EBEST=G.wave;localStorage.emberfall_ew=EBEST}}catch(e){BEST=Math.max(BEST,G.score)}}
function gapDir(x,y){if((x==7||x==8)&&y==0)return'n';if((x==7||x==8)&&y==RH-1)return's';if((y==5||y==6)&&x==0)return'w';if((y==5||y==6)&&x==RW-1)return'e';return null}
function solid(x,y){if(x<0||y<0||x>=RW||y>=RH)return false;const R=G.room;if(x==0||y==0||x==RW-1||y==RH-1){const d=gapDir(x,y);return!d||!(R.ex[d]&&R.cleared)}return R.pil.has(x+','+y)}
const tl=v=>Math.floor(v/T);
function blocked(x,y,h){return solid(tl(x-h),tl(y-h))||solid(tl(x+h-.01),tl(y-h))||solid(tl(x-h),tl(y+h-.01))||solid(tl(x+h-.01),tl(y+h-.01))}
function mv(o,dx,dy,h){if(!blocked(o.x+dx,o.y,h))o.x+=dx;if(!blocked(o.x,o.y+dy,h))o.y+=dy}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=rnd()*6.28,s=20+rnd()*70;G.pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.3+rnd()*.4,c,s:rnd()<.3?3:2})}}
function mkE(t,x,y){const mhp=t=='boss'?16+DP()*10:D[t].hp+(G.ch==5?G.wave>>1:G.ch==4?6:G.ch==3?4:G.ch==2?2:0);return{t,x,y,born:G.t,hp:mhp,mhp,cd:1+rnd()*1.5,ph:rnd(),fl:0,kx:0,ky:0,id:rnd()*6,r:D[t].r,h:D[t].h}}
function genFloor(n){
 const rs={},K=(x,y)=>x+','+y;rs[K(2,2)]={x:2,y:2,d:0};const L=[[2,2]],cnt=6+n*2+(G.ch>1?2:0);
 for(let g=0;L.length<cnt&&g<500;g++){const[a,b]=L[rnd()*L.length|0],d=[[1,0],[-1,0],[0,1],[0,-1]][rnd()*4|0],x=a+d[0],y=b+d[1];if(x<0||y<0||x>4||y>4||rs[K(x,y)])continue;rs[K(x,y)]={x,y};L.push([x,y])}
 const q=[[2,2]];let far=rs[K(2,2)];
 for(let i=0;i<q.length;i++){const[x,y]=q[i],r=rs[K(x,y)];[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const o=rs[K(x+dx,y+dy)];if(o&&o.d===undefined){o.d=r.d+1;q.push([o.x,o.y]);if(o.d>far.d)far=o}})}
 L.forEach(([x,y])=>{const r=rs[K(x,y)];r.ex={e:!!rs[K(x+1,y)],w:!!rs[K(x-1,y)],s:!!rs[K(x,y+1)],n:!!rs[K(x,y-1)]};r.pil=new Set();r.pk=[];r.cleared=r.d==0;r.seen=false;r.boss=r===far;
  if(r.d&&!r.boss){const c=[];[3,4,11,12].forEach(a=>[3,4,7,8].forEach(b=>c.push(a+','+b)));for(let i=rnd()*5|0;i>0;i--)r.pil.add(c[rnd()*16|0])}});

}
function enter(R,x,y){const p=G.p;G.room=R;R.seen=true;p.x=x;p.y=y;G.pr=[];G.en=[];G.dy=[];G.ft=[];G.ai=[];G.tr=.3;if(G.pet){G.pet.x=x;G.pet.y=y}

  else{const d=DP(),n=Math.min(8,2+(rnd()*2|0)+d),pool=d==1?['slime','slime','bat']:d==2?['slime','bat','skel','skel']:d<5?['bat','skel','skel','slime']:['bat','bat','skel','skel','skel'];

function toMenu(f){G={mode:'menu',t:0,floor:1,en:[],pt:[],room:null,paused:false,sel:0,tr:.3,wf:f?1:0}}
function startIntro(c){G={mode:'intro',t:0,sc:-1,fc:c,floor:1,en:[],pt:[],room:null,paused:false}}

function menuKey(c){const m=G.mode,ok=c=='Enter'||c=='Space';
 if(m=='boot'){if(G.t>.3)startIntro()}
 else if(m=='intro'){if(G.t>.5&&(ok||c=='Escape'))introEnd()}
 else if(m=='select')selKey(c);else if(m=='code')codeKey(c);else if(m=='pick')pickKey(c);else if(m=='custom')cusKey(c);else if(m=='play'){if(G.paused&&c=='Escape')toMenu()}else if(DN[m]){if(G.t>.5&&(ok||c=='Escape'))DN[m]()}else if(m=='chap')chapKey(c);else if(m=='story'){if(G.t>.5&&(ok||c=='Escape'))toSelect()}else if(m=='menu'){const n=7;if(c.startsWith('Key')){G.kb=((G.kb||'')+c[3]).slice(-9);if(G.kb=='EMBERFALL'){G.kb='';codeOK()}}if(c=='ArrowDown'||c=='KeyS'){G.sel=(G.sel+1)%n;sfx.sel()}else if(c=='ArrowUp'||c=='KeyW'){G.sel=(G.sel+n-1)%n;sfx.sel()}else if(ok&&G.t>.3)pick(G.sel)}

function updPet(dt){const g=G,p=g.p,pt=g.pet;if(!pt||!PETI)return;pt.x+=(p.x-p.fx*14-pt.x)*Math.min(1,dt*6);pt.y+=(p.y+10-p.fy*4-pt.y)*Math.min(1,dt*6);pt.cd-=dt;

 if(PETI==2)p.mp=Math.min(p.mmp,p.mp+4*dt);

 txt(TOUCH?'TAP ARROWS OR THE CARD':'UP/DOWN ROW  LEFT/RIGHT CHANGE  ENTER EQUIP',128,176,'#6a6fa8',6,'center');if(!TOUCH)txt('ESC: BACK',128,196,'#6a6fa8',6,'center')}

function arena(R){R.pil=new Set();[[4,4],[11,4],[4,8],[11,8]].forEach(([x,y])=>{if(!R.boss&&rnd()<.55)R.pil.add(x+','+y)})}

function endWave(){const p=G.p;G.room.cleared=true;G.score+=50*G.wave;p.hp=Math.min(p.mhp,p.hp+1);p.mp=p.mmp;G.wave++;G.cho=BOONS.slice().sort(()=>rnd()-.5).slice(0,3);G.pc=0;G.mode='pick';G.t=0;G.pl=undefined}
